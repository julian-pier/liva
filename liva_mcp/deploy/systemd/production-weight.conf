# Production write access for the two explicit MCP write targets.
# Do not bind SQLite -wal/-shm files: they are transient and must never be a
# prerequisite for systemd namespace construction. Write connections use
# journal_mode=DELETE, so an isolated file bind remains sufficient.
[Service]
Environment=PYTHONPATH=/opt/liva
Environment=LIVA_MCP_NUTRITION_WRITE_DB=/var/lib/liva/.local/share/liva-mcp-remote/database-write/ernaehrung.sqlite3
Environment=LIVA_MCP_CORE_WRITE_DB=/var/lib/liva/.local/share/liva-mcp-remote/database-write/core.sqlite3
BindPaths=/opt/liva/database/ernaehrung.sqlite3:/var/lib/liva/.local/share/liva-mcp-remote/database-write/ernaehrung.sqlite3
BindPaths=/opt/liva/database/core.sqlite3:/var/lib/liva/.local/share/liva-mcp-remote/database-write/core.sqlite3
