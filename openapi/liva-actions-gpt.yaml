{
  "openapi": "3.0.3",
  "info": {
    "title": "LIVA GPT Actions API (Slim)",
    "version": "2.0.0-gpt",
    "description": "Slim Custom GPT schema exposing readLiva/actLiva plus typed plan and logging actions. Existing nutrition plans must use getNutritionPlanDetailDirect followed by patchNutritionPlanDirect with slot_path-based operations and a verified readback; legacy operator tools are not part of this surface."
  },
  "servers": [
    {
      "url": "https://liva.example.com",
      "description": "LIVA LIVA host"
    }
  ],
  "paths": {
    "/api/v2/actions/liva/read": {
      "post": {
        "operationId": "readLiva",
        "summary": "Unified LIVA read facade",
        "description": "Unified LIVA read facade for snapshots, state, context, training, nutrition, recovery, cardio, weight, endurance and memory. Choose the correct mode and optional filters from LivaReadRequest.",
        "x-openai-isConsequential": false,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LivaReadRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Read result"
          },
          "400": {
            "description": "Validation error"
          },
          "401": {
            "description": "Unauthorized"
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
    "/api/v2/actions/liva/act": {
      "post": {
        "operationId": "actLiva",
        "summary": "Unified LIVA write facade",
        "description": "Official LIVA write facade. Send domain, command, and helper fields via top-level, value, or payload. For plan changes use dry_run=true first. patch_training_plan accepts operations, value.operations, or payload.operations.",
        "x-openai-isConsequential": false,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LivaActRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Write result"
          },
          "400": {
            "description": "Validation error"
          },
          "401": {
            "description": "Unauthorized"
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
