      "get": {
        "operationId": "getCoreMorningContext",
        "summary": "Read CORE morning context",
        "description": "Returns a compact GPT-safe morning context so the daily board payload can stay short and use the correct session label. Always call this first for morning triggers like 'Gewicht & HRV sind drin', 'Check CORE' or 'Morgencheck'.",
