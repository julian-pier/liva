            }
          },
          "notes": {
            "type": "string"
          },
          "dry_run": {
            "type": "boolean",
            "description": "Use true first for GPT preview flows. Only use false after the user confirms the parsed session."
          },
          "source_message": {
            "type": "string",
            "description": "Optional user hint such as 'Foto vom Notizbuch loggen'."
          },
          "plan_id": {},
          "template_id": {},
          "session_key": {
            "type": "string"
          }
        }
      },
      "TrainingExerciseInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string"
          },
          "exercise_name": {
            "type": "string"
          },
          "variation": {
            "type": "string"
          },
          "variation_user_locked": {
            "type": "boolean",
            "description": "True only when the athlete explicitly confirmed the variant. Otherwise false so LIVA can resolve it from plan and weight history."
          },
          "notes": {
            "type": "string"
          },
          "progression_excluded": {
            "type": "boolean",
            "description": "Exclude every set of this exercise from the current progression quote/comparison."
          },
          "progression_exclusion_reason": {
            "type": "string",
            "maxLength": 240,
            "description": "Required when the exercise is excluded; inherited by all its sets."
          },
          "sets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TrainingSetInput"
            }
          }
        }
      },
      "TrainingSetInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "reps": {},
          "weight": {},
          "rpe": {
            "description": "Actual RPE for this set. Send it per set when known; if omitted, the set is stored with rpe=null and the write response reports missing_rpe/incomplete_fields."
          },
          "set_number": {
            "type": "integer"
          },
          "raw_token": {
            "type": "string"
          },
          "progression_excluded": {
            "type": "boolean",
            "description": "Exclude only this set from the current progression quote/comparison."
          },
          "progression_exclusion_reason": {
            "type": "string",
            "maxLength": 240,
            "description": "Required when progression_excluded=true, e.g. Technik geändert or anderer Seilzug."
          }
        }
      },
      "CoreBoardBuildRequest": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "date": {
            "type": "string",
            "format": "date"
          },
          "day_iso": {
            "type": "string",
            "format": "date"
          },
          "mode": {
            "type": "string",
            "enum": [
              "gpt_fast",
              "full"
            ],
            "description": "Use gpt_fast for morning check-ins when GPT only needs a compact confirmation response."
          },
          "fast": {
            "type": "boolean",
            "description": "Alias for mode='gpt_fast'."
          },
          "memory_mode": {
            "type": "string",
            "enum": [
              "skip",
              "sync"
            ],
            "description": "For gpt_fast, defaults to 'skip' so memory building does not block the response. Use 'sync' to force the legacy synchronous memory build."
          },
          "debug_timing": {
            "type": "boolean",
            "description": "Include compact timing measurements in the response."
          },
          "source": {
            "type": "string",
            "default": "gpt_checkin"
          },
          "trigger": {
            "type": "string",
            "description": "Short machine trigger, e.g. weight_hrv_checkin."
          },
          "source_message": {
            "type": "string",
            "description": "The athlete's raw check-in sentence or GPT-visible prompt context."
          },
          "message": {
            "type": "string",
            "description": "Alias for source_message."
          },
          "human_headline": {
            "type": "string",
            "description": "Short human-facing decision headline."
          },
          "human_summary": {
            "type": "string",
            "description": "Short human-facing why text."
          },
          "decision_intent": {
            "type": "string",
            "enum": [
              "full_send",
              "train_normal",
              "train_controlled",
              "reduce_volume",
              "technique_only",
              "recovery_only",
              "hard_stop",
              "unknown"
            ]
          },
          "confidence": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          },
          "machine_briefing": {
            "type": "object",
            "additionalProperties": true
          },
          "briefing": {
            "type": "object",
            "additionalProperties": true
          },
          "visible_reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "training_card": {
            "type": "object",
            "additionalProperties": true,
            "description": "Optional GPT-authored training-card hints that get stored on the CORE Board and can seed the persisted CORE Training-Card. May include title, summary, items and today_changed_lines.",
            "properties": {
              "title": {
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "session_type": {
                "type": "string"
              },
              "session_label": {
                "type": "string"
              },
              "decision_intent": {
                "type": "string"
              },
              "today_changed_lines": {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "type": "string"
                },
                "description": "Short, concrete day-specific change lines written by GPT for the visible CORE-Prognose. Use this instead of generic mode text whenever concrete signals exist."
              },
              "items": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": true
                }
              }
            }
          },
          "data_status": {
            "type": "object",
            "additionalProperties": true
          },
          "legacy_core": {
            "type": "object",
            "additionalProperties": true
          },
          "build_training_card": {
            "type": "boolean"
          },
          "force_training_card": {
            "type": "boolean"
          },
          "memory_candidates": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true,
              "properties": {
                "timeframe": {
                  "type": "string",
                  "enum": [
                    "today",
                    "week",
                    "phase",
                    "year",
                    "global"
                  ]
                },
                "category": {
                  "type": "string"
                },
                "title": {
                  "type": "string"
                },
                "summary": {
                  "type": "string"
                },
                "confidence": {
                  "type": "number"
                },
                "evidence": {
                  "type": "object",
                  "additionalProperties": true
                },
                "write_policy": {
                  "type": "string",
                  "enum": [
                    "auto_log",
                    "candidate",
                    "manual_review",
                    "never_auto"
                  ]
                }
              }
            }
          }
        }
      },
      "OkResponse": {
        "type": "object",
        "required": [
          "ok"
        ],
        "properties": {
          "ok": {
            "type": "boolean"
          },
          "data_status": {
            "type": "string"
          },
          "resolution": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Resolution"
            }
          },
          "execution": {
            "$ref": "#/components/schemas/Execution"
          }
        },
        "additionalProperties": true
      },
      "Resolution": {
        "type": "object",
        "properties": {
          "requested": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "resolved",
              "ambiguous_resolved",
              "unresolved"
            ]
          },
          "resolved_to": {
            "properties": {
              "exercise_key": {
                "type": "string"
              },
              "display_name": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "variation": {},
              "device": {},
              "laterality": {}
            },
            "additionalProperties": true
          },
          "match_type": {},
          "alternatives": {
            "type": "array",
            "items": {
              "type": "object"
            }
          }
        },
        "additionalProperties": true
      },
      "Execution": {
        "type": "object",
        "required": [
          "mode",
          "live_state_changed",
          "affected_resources"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "applied_live",
              "applied_sidecar",
              "logged_only",
              "dry_run",
              "no_change",
              "write"
            ]
          },
          "live_state_changed": {
            "type": "boolean"
          },
          "affected_resources": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "detail": {
            "type": "string"
          }
        }
      }
    }
  }
}
